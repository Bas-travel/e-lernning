# LOCAL development stack: MySQL 8 + API.
#
#   docker compose up --build -d      # start
#   docker compose logs -f api        # follow API logs
#   docker compose down               # stop (data kept in the mysql_data_v2 volume)
#
# Schema comes ONLY from db/migrations (applied by the API at startup) —
# do not mount SQL files into /docker-entrypoint-initdb.d, it would collide
# with the migrations. Credentials below are local-only defaults; override
# them with a .env file next to this compose file (see env/local.env.example).
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ab_learning}
      MYSQL_USER: ${MYSQL_USER:-ab_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ab_app_pw}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      # 127.0.0.1 only: the local DB is never exposed to the network.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data_v2:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "8080"
      APP_ENV: "dev"
      DB_DSN: "${MYSQL_USER:-ab_app}:${MYSQL_PASSWORD:-ab_app_pw}@tcp(mysql:3306)/${MYSQL_DATABASE:-ab_learning}?parseTime=true&charset=utf8mb4&loc=UTC"
      JWT_SECRET: "${JWT_SECRET:-dev-only-insecure-secret-change-me}"
      MIGRATIONS_DIR: "/app/db/migrations"
      # Demo accounts (password "Password123!") + catalog. Dev only: the API
      # refuses SEED_DEV / AUTH_DELIVERY=log in staging and production.
      SEED_DEV: "true"
      # OTP and reset codes are printed in `docker compose logs api`.
      AUTH_DELIVERY: "log"
      # Run the app on this fixed port:
      #   flutter run -d chrome --web-port 56901
      CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGIN:-http://localhost:56901}"
      UPLOAD_DIR: "/app/uploads"
      RATE_LIMIT_REQUESTS: "120"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - api_uploads:/app/uploads

volumes:
  # NOTE: renamed from `mysql_data`. The old volume holds a schema created by
  # the previous compose file (SQL mounted into initdb) that conflicts with the
  # migrations. It is left untouched; remove it yourself once you no longer
  # need it:  docker volume rm ab-learning-api_mysql_data
  mysql_data_v2:
  api_uploads:
