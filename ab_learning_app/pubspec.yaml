name: ab_learning_app
description: AB Learning — AI Career Learning Platform (Flutter client)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Networking (used by DioApiClient once the real backend is ready;
  # MockApiClient below does not need it, so the app runs with zero
  # network access today)
  dio: ^5.4.3

  # Local/secure storage for auth tokens
  flutter_secure_storage: ^9.2.2

  # Misc UI helpers
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Uncomment once real font/icon assets are added:
  # fonts:
