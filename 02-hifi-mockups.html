<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>AB LEARNING — High-Fidelity Mockups</title>
<style>
:root{
  --primary:#4338CA; --secondary:#7C3AED; --accent:#0EA5E9;
  --success:#22C55E; --warning:#F59E0B; --error:#EF4444;
  --bg:#F8FAFC; --text:#0F172A; --text2:#64748B;
  --pill-success-bg:#DCFCE7; --pill-warn-bg:#FEF3C7; --pill-error-bg:#FEE2E2;
  --btn-primary-bg:#4338CA; --btn-outline-border:#4338CA;
  --card-border:#EEF0F4;
  --r-card:16px; --r-btn:12px; --r-in:10px; --r-badge:999px;
  --font: 'Inter','Noto Sans Thai',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font);}
body{background:#EEF0F5;color:var(--text);}
.app{display:flex;min-height:100vh;}
.rail{width:230px;background:#0F172A;color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.rail h1{font-size:15px;font-weight:600;margin-bottom:2px;color:#fff;}
.rail .sub{font-size:11px;color:#94A3B8;margin-bottom:18px;}
.rail button{display:block;width:100%;text-align:left;background:none;border:none;color:#CBD5E1;padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:2px;}
.rail button:hover{background:#1E293B;}
.rail button.active{background:var(--primary);color:#fff;}
.rail .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#64748B;margin:14px 0 6px 10px;}
.main{flex:1;padding:28px 36px;}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.toolbar h2{font-size:19px;font-weight:600;}
.toolbar .toggle{display:flex;background:#fff;border-radius:10px;padding:4px;border:1px solid #E2E8F0;}
.toolbar .toggle button{border:none;background:none;padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);}
.toolbar .toggle button.active{background:var(--primary);color:#fff;}
.stage{display:flex;justify-content:center;}
.frame-m{width:375px;height:812px;background:#fff;border-radius:36px;border:8px solid #111;overflow-y:auto;box-shadow:0 20px 50px rgba(15,23,42,.25);}
.frame-d{width:1280px;max-width:100%;min-height:800px;background:#fff;border-radius:12px;border:1px solid #E2E8F0;overflow:hidden;box-shadow:0 20px 50px rgba(15,23,42,.15);}
/* shared components */
.scr{background:var(--bg);min-height:100%;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid #E2E8F0;}
.topbar .greet{font-size:14px;font-weight:600;}
.topbar .icons{display:flex;gap:14px;align-items:center;color:var(--text2);font-size:13px;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
.coin{background:#FEF3C7;color:#92400E;font-size:11px;padding:3px 8px;border-radius:var(--r-badge);font-weight:600;}
.bottomnav{position:sticky;bottom:0;background:#fff;border-top:1px solid #E2E8F0;display:flex;justify-content:space-around;padding:9px 0 12px;font-size:10px;color:var(--text2);}
.bottomnav .it{display:flex;flex-direction:column;align-items:center;gap:3px;}
.bottomnav .it.active{color:var(--primary);font-weight:600;}
.dot{width:20px;height:20px;border-radius:6px;background:#E2E8F0;}
.dot.active{background:var(--primary);}
.card{background:#fff;border-radius:var(--r-card);padding:14px;border:1px solid #EEF0F4;}
.btn-p{background:var(--primary);color:#fff;border:none;border-radius:var(--r-btn);padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-s{background:#fff;color:var(--primary);border:1px solid var(--primary);border-radius:var(--r-btn);padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-g{background:none;color:var(--text2);border:1px solid #E2E8F0;border-radius:var(--r-btn);padding:9px 14px;font-size:12px;cursor:pointer;}
.pill{border-radius:var(--r-badge);padding:3px 10px;font-size:10.5px;font-weight:600;}
.pill-success{background:#DCFCE7;color:#166534;}
.pill-warn{background:#FEF3C7;color:#92400E;}
.pill-error{background:#FEE2E2;color:#991B1B;}
.pill-live{background:#CFFAFE;color:#0E7490;}
.h-section{font-size:14px;font-weight:600;margin:18px 0 10px;padding:0 16px;}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;}
.hscroll::-webkit-scrollbar{display:none;}
.ccard{min-width:180px;background:#fff;border-radius:var(--r-card);border:1px solid #EEF0F4;overflow:hidden;flex-shrink:0;}
.ccard .thumb{height:96px;background:linear-gradient(135deg,var(--primary),var(--secondary));}
.ccard .body{padding:10px;}
.ccard .title{font-size:12.5px;font-weight:600;margin-bottom:4px;}
.ccard .meta{font-size:11px;color:var(--text2);display:flex;justify-content:space-between;align-items:center;}
.progress-track{height:6px;background:#E2E8F0;border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:var(--primary);}
.sidebar-d{width:240px;background:#fff;border-right:1px solid #E2E8F0;padding:20px 14px;flex-shrink:0;}
.sidebar-d .logo{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:22px;padding:0 8px;}
.sidebar-d a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--text2);text-decoration:none;margin-bottom:2px;}
.sidebar-d a.active{background:#EEF2FF;color:var(--primary);font-weight:600;}
.d-flex{display:flex;}
.d-row{display:flex;gap:18px;}
.d-body{flex:1;padding:24px 28px;overflow-y:auto;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.kpi{background:#fff;border-radius:var(--r-card);border:1px solid #EEF0F4;padding:16px;}
.kpi .lbl{font-size:11.5px;color:var(--text2);margin-bottom:6px;}
.kpi .val{font-size:22px;font-weight:700;}
.d-topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid #E2E8F0;background:#fff;}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;}
table.dt th{text-align:left;color:var(--text2);font-weight:600;padding:9px 10px;border-bottom:1px solid #E2E8F0;font-size:11.5px;}
table.dt td{padding:10px;border-bottom:1px solid #F1F5F9;}
.chip{background:#F1F5F9;border-radius:99px;padding:6px 12px;font-size:12px;color:var(--text2);white-space:nowrap;}
.chip.active{background:var(--primary);color:#fff;}
.badge-role{font-size:10.5px;padding:3px 8px;border-radius:6px;background:#EEF2FF;color:var(--primary);font-weight:600;}
</style>
</head>

let current = 'splash', device = 'm';
function render(){
  document.getElementById('scr-title').textContent = titles[current];
  const stage = document.getElementById('stage');
  if(device==='m'){
    stage.innerHTML = `<div class="frame-m">${screens[current].m}</div>`;
  } else {
    stage.innerHTML = `<div class="frame-d">${screens[current].d}</div>`;
  }
}
function setDevice(d){
  device = d;
  document.getElementById('tg-m').classList.toggle('active', d==='m');
  document.getElementById('tg-d').classList.toggle('active', d==='d');
  render();
}
document.querySelectorAll('.rail button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.rail button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    current = b.dataset.s;
    render();
  });
});
render();
</script>
